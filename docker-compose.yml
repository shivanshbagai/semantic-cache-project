version: '3.8'

services:
  # Service 1: The Vector Database
  redis-vector:
    image: redis/redis-stack-server:latest
    container_name: redis-semantic-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # Service 2: The Local Embedding & LLM Engine
  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  redis_data:
  ollama_data: